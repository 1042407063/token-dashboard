<!DOCTYPE html>
<html data-theme="light" lang="zh-CN">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1" name="viewport">
<title>WorkBuddy Token 用量</title>
<link href="/static/style.css?v=34" rel="stylesheet">
<script>
  try {
    var forced = new URLSearchParams(location.search).get('theme');
    var saved = localStorage.getItem('tp-theme');
    var sys = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = forced || saved || sys;
  } catch (e) {}
</script>
</head>
<body>
<div class="app">

  <header class="bar">
    <div class="brand"><span class="pulse"></span>WorkBuddy Token</div>
    <div class="meta">
      <span class="live" id="live">连接中…</span>
      <span class="chip" id="indexInfo">索引 —</span>
      <span class="chip" id="clock">—</span>
    </div>
    <div class="actions">
      <span class="chip acct off" id="acctChip" title="未识别到当前账号">账号 —</span>
      <div class="seg acct" id="segAcct" style="display:none"></div>
      <div class="seg" id="segBreak">
        <button class="on" data-v="model">模型</button>
        <button data-v="project">项目</button>
        <button data-v="account">账号</button>
      </div>
      <div class="seg" id="segRange">
        <button class="on" data-v="today">今天</button>
        <button data-v="yesterday">昨天</button>
        <button data-v="before">前天</button>
        <button data-v="7d">7 天</button>
        <button data-v="30d">30 天</button>
      </div>
      <button class="chip btn" id="acctLogBtn" title="账号切换时间线">⇄</button>
      <button class="chip btn" id="acctRenameBtn" title="自定义账号名称">✎</button>
      <button class="icon" id="themeBtn" title="切换明暗">◐</button>
      <div class="pop" id="acctLogPop"></div>
      <div class="pop" id="acctRenamePop"></div>
    </div>
  </header>

  <section class="kpis">
    <article class="card kpi">
      <div class="cap"><span id="sessCap">活跃会话</span><span class="sessname" id="sessName"></span><span class="status" id="sessTag"></span></div>
      <div class="num" data-num="0" id="kSession">—</div>
      <div class="sub" id="kSessionSub">—</div>
      <canvas class="spark" hidden id="spark"></canvas>
    </article>

    <article class="card kpi">
      <div class="cap"><span id="rangeCap">区间累计</span><span class="tag" id="rangeTag"></span></div>
      <div class="num" data-num="0" id="kRange">—</div>
      <div class="sub" id="kRangeSub">—</div>
      <div class="mini" id="todayMini"></div>
    </article>

    <article class="card kpi">
      <div class="cap"><span id="avgCap">区间日均</span></div>
      <div class="num" data-num="0" id="kAvg">—</div>
      <div class="sub" id="kAvgSub">—</div>
    </article>

    <article class="card kpi">
      <div class="cap">缓存命中率<span class="tag" id="cacheTag"></span></div>
      <div class="num" data-num="0" id="kCache">—</div>
      <div class="sub" id="kCacheSub">—</div>
    </article>
  </section>

  <section class="mid">
    <article class="card">
      <div class="cap"><span id="hourCap">按小时</span><span class="hint" id="hourHint"></span></div>
      <div class="chart" id="chartHour"></div>
    </article>
    <article class="card">
      <div class="cap" id="pieCap">模型占比</div>
      <div class="chart" id="chartPie"></div>
    </article>
  </section>

  <section class="duo">
    <article class="card">
      <div class="cap"><span id="projCap">项目消耗 TOP 5</span><span class="hint" id="projHint">今日</span></div>
      <div class="rank" id="projRank"></div>
    </article>
    <article class="card">
      <div class="cap"><span>会话消耗 TOP 5</span><span class="hint" id="sessHint">今日</span></div>
      <div class="rank" id="sessRank"></div>
    </article>
  </section>

  <section class="pair">
    <article class="card">
      <div class="cap"><span>每日趋势</span><span class="hint" id="trendHint"></span><div class="seg mini" id="segDays"><button data-v="7">7</button><button class="on" data-v="30">30</button></div></div>
      <div class="chart" id="chartTrend"></div>
    </article>
    <article class="card">
      <div class="cap">52 周热力图<span class="hint">越深越多</span></div>
      <div class="chart" id="chartHeat"></div>
    </article>
  </section>

</div>

<footer class="foot">
  <span class="foot-txt" id="foot">数据来自本机 ~/.workbuddy 转录，纯本地，不上传</span>
  <span class="version-badge" id="versionBadge">v1.4.0</span>
</footer>
<div class="toast" id="acctToast"></div>

<script id="boot-data" type="application/json">__BOOT__</script>
<script src="/static/vendor/echarts.min.js"></script>
<script src="/static/app.js?v=34"></script>
</body>
</html>
